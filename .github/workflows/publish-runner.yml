name: Publish runner image

# Builds docker/runner.Dockerfile for linux/amd64 and linux/arm64, checks it, and publishes it to
# ghcr.io/uniandes-misw4103/misw4103-runner with two tags:
#   node24             the one proyecto-base/compose.yml uses (moves with every publication)
#   node24-<commit>    fixed, to go back to a previous image
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - .github/workflows/publish-runner.yml
  # Monthly rebuild: picks up the security updates of the base image and of Debian's packages.
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runner
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/uniandes-misw4103/misw4103-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # QEMU builds the arm64 image on the amd64 runner.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=node24
            type=sha,prefix=node24-

      - name: Build for the check (amd64)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/runner.Dockerfile
          platforms: linux/amd64
          load: true
          tags: misw4103-runner:check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The entrypoint runs the command as uid 1000 with a virtual display, and the tools find their
      # system libraries and Chromium.
      - name: Check
        run: |
          docker run --rm misw4103-runner:check sh -c '
            set -e
            test "$(id -u)" = 1000
            test "$DISPLAY" = :99
            node --version
            chromium --version
            xdpyinfo > /dev/null
            git --version
            rsync --version | head -n 1
          '

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish (amd64, arm64)
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/runner.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
