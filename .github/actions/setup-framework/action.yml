name: "Setup Framework Action"
description: "Sets up a testing framework in a target repository"

inputs:
  framework:
    description: "Framework de automatización: kraken, puppeteer, playwright o cypress"
    required: true
  repository:
    description: "Target repository to update"
    required: true
  token:
    description: "GitHub token with repository access"
    required: true
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        # The action only runs `npm pkg set`; there are no dependencies to cache.
        package-manager-cache: false

    - name: Checkout Target Repository
      uses: actions/checkout@v7
      with:
        repository: ${{ inputs.repository }}
        token: ${{ inputs.token }}
        path: target-repo

    - name: Checkout Base Repo
      uses: actions/checkout@v7
      with:
        repository: Uniandes-MISW4103/proyecto-${{ inputs.framework }}-template
        token: ${{ inputs.token }}
        path: base-repo

    - name: Install Module
      shell: bash
      env:
        MODULE_GROUP: e2e
        MODULE_ID: ${{ inputs.framework }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-module.sh" "$MODULE_GROUP" "$MODULE_ID" base-repo target-repo

    - name: Commit Changes to Target
      shell: bash
      run: |
        cd target-repo
        git config user.name "Equipo Docente MISW4103"
        git config user.email "equipo-docente-misw4103@uniandes.edu.co"
        git add .
        git commit -m "chore: initial setup for ${{ inputs.framework }} framework"
        git push origin HEAD
